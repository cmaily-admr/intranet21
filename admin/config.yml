backend:
  name: github
  repo: cmaily-admr/intranet21
  branch: main
  auth_endpoint: /api/auth
  api_root: https://api.github.com
  base_url: https://intranet21.pages.dev

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  # ==================== ACTUALITÉS ====================
  - name: "actualites"
    label: "Actualités"
    folder: "_data/actualites"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Titre", name: "titre", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime", format: "YYYY-MM-DD HH:mm" }
      - { label: "Contenu", name: "contenu", widget: "markdown" }
      - { label: "Image (optionnelle)", name: "image", widget: "image", required: false }
      - { label: "Ordre d'affichage", name: "ordre", widget: "number", default: 0, hint: "0 = dernière (en haut), 1, 2, 3... = plus anciennes (en bas)" }

  # ==================== RUBRIQUES ====================
  - name: "rubriques"
    label: "Rubriques"
    folder: "_data/rubriques"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Titre de la rubrique", name: "titre", widget: "string" }
      - { label: "Couleur d'accent (ex: #FF6B6B)", name: "couleur", widget: "string", default: "#0066cc" }
      - { label: "Blocs de contenu", name: "blocs", widget: "list", fields:
          [
            { label: "Titre du bloc", name: "titre_bloc", widget: "string" },
            { label: "Contenu", name: "contenu_bloc", widget: "markdown" },
            { label: "Image (optionnelle)", name: "image_bloc", widget: "image", required: false },
            { label: "Ouvert par défaut ?", name: "ouvert", widget: "boolean", default: false }
          ]
        }
      - { label: "Documents", name: "documents", widget: "list", fields:
          [
            { label: "Nom du document", name: "nom_doc", widget: "string" },
            { label: "Fichier", name: "fichier_doc", widget: "file" }
          ], required: false
        }
