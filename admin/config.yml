backend:
  name: github
  repo: cmaily-admr/intranet21
  branch: main
  auth_endpoint: api/auth
  commit_message: "CMS: {{message}}"
  client_id: Ov23liE6Gvj39lE3gtYk

media_folder: "uploads"
public_folder: "/uploads"

collections:
  # ============================================================
  #  L'actualité à la une (bloc unique en haut de l'accueil)
  # ============================================================
  - name: "une"
    label: "Actualité à la une"
    delete: false
    editor:
      preview: false
    files:
      - name: "une"
        label: "Actualité à la une"
        file: "_data/une.json"
        fields:
          - { label: "Titre", name: "titre", widget: "string" }
          - { label: "Date", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
          - { label: "Lien vidéo (facultatif)", name: "video_url", widget: "string", required: false, hint: "https://www.youtube-nocookie.com/embed/IDENTIFIANT — laissez vide s'il n'y a pas de vidéo." }
          - { label: "Contenu", name: "contenu", widget: "markdown", hint: "Le corps du texte." }
          - { label: "Document à télécharger (facultatif)", name: "document", widget: "file", required: false }
          - { label: "Texte du bouton", name: "document_label", widget: "string", required: false, default: "Télécharger le document (PDF)" }

  # ============================================================
  #  Les rubriques (pages à sections déroulantes)
  #  Chaque fichier = une page. On édite ses sections et leurs contenus.
  # ============================================================
  - name: "rubriques"
    label: "Rubriques (pages à sections)"
    label_singular: "Rubrique"
    delete: false          # on ne supprime pas une rubrique entière depuis le CMS
    editor:
      preview: false
    files:
      - name: "cse"
        label: "CSE"
        file: "_data/rubriques/cse.json"
        fields: &champs_rubrique   # ancre : réutilisée pour les autres rubriques
          - { label: "Titre de la page", name: "titre", widget: "string" }
          - { label: "Sous-titre (bandeau)", name: "sous_titre", widget: "text" }
          - { label: "Couleur d'accent", name: "couleur", widget: "color", required: false, default: "#2E7D9A" }
          - label: "Sections déroulantes"
            name: "sections"
            widget: "list"
            label_singular: "Section"
            summary: "{{fields.titre}}"
            fields:
              - { label: "Titre de la section", name: "titre", widget: "string" }
              - { label: "Ouverte par défaut ?", name: "ouvert", widget: "boolean", default: false, required: false }
              - label: "Contenus de la section"
                name: "blocs"
                widget: "list"
                label_singular: "Contenu"
                types:
                  - label: "Texte"
                    name: "texte"
                    summary: "Texte"
                    fields:
                      - { label: "Texte", name: "texte", widget: "markdown" }
                  - label: "Document (PDF)"
                    name: "document"
                    summary: "{{fields.titre_doc}}"
                    fields:
                      - { label: "Titre du document", name: "titre_doc", widget: "string" }
                      - { label: "Précision (facultatif)", name: "precision", widget: "string", required: false, hint: "Ex. : À retourner avant le 30 novembre." }
                      - { label: "Fichier", name: "fichier", widget: "file" }
                      - { label: "Date d'ajout", name: "date_ajout", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD", required: false, default: "", hint: "Le badge « Nouveau » s'affiche automatiquement pendant 30 jours après cette date." }
                      - { label: "Forcer le badge « Nouveau »", name: "nouveau", widget: "boolean", default: false, required: false, hint: "Laissez décoché : le badge est automatique. Cochez seulement pour forcer l'affichage." }
                  - label: "Image"
                    name: "image"
                    summary: "Image"
                    fields:
                      - { label: "Image", name: "image", widget: "image" }
                      - { label: "Légende / texte alternatif", name: "legende", widget: "string", required: false }
                  - label: "Vidéo (lien)"
                    name: "video"
                    summary: "{{fields.titre_video}}"
                    fields:
                      - { label: "Titre de la vidéo (facultatif)", name: "titre_video", widget: "string", required: false }
                      - { label: "Lien de la vidéo", name: "video_url", widget: "string", hint: "https://www.youtube-nocookie.com/embed/IDENTIFIANT" }

      - name: "demarche-qualite"
        label: "Démarche qualité"
        file: "_data/rubriques/demarche-qualite.json"
        fields: *champs_rubrique

      - name: "ressources-humaines"
        label: "Ressources humaines"
        file: "_data/rubriques/ressources-humaines.json"
        fields: *champs_rubrique

      - name: "communication"
        label: "Communication"
        file: "_data/rubriques/communication.json"
        fields: *champs_rubrique

      - name: "limites-professionnelles"
        label: "Limites professionnelles"
        file: "_data/rubriques/limites-professionnelles.json"
        fields: *champs_rubrique

  # ============================================================
  #  Actualités précédentes (liste, branchée plus tard)
  # ============================================================
  - name: "actualites"
    label: "Actualités précédentes"
    label_singular: "Actualité"
    folder: "_data/actualites"
    create: true
    extension: "json"
    format: "json"
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{date}} — {{titre}}"
    sortable_fields: ["date", "titre"]
    editor:
      preview: false
    fields:
      - { label: "Titre", name: "titre", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
      - label: "Rubrique concernée"
        name: "rubrique"
        widget: "select"
        options: ["CSE", "Démarche qualité", "Ressources humaines", "Communication", "Limites professionnelles"]
        hint: "Sert d'étiquette de couleur sur la carte."
      - label: "Couleur de l'étiquette"
        name: "couleur"
        widget: "select"
        options:
          - { label: "CSE (bleu)", value: "#2E7D9A" }
          - { label: "Démarche qualité (orange)", value: "#E58A00" }
          - { label: "Ressources humaines (vert)", value: "#5B9B31" }
          - { label: "Communication (brique)", value: "#B0553A" }
          - { label: "Limites professionnelles (ardoise)", value: "#4A5A6A" }
        hint: "Choisissez la couleur assortie à la rubrique."
      - { label: "Résumé", name: "resume", widget: "text", hint: "Court texte affiché sur la carte." }
      - label: "Type de lien"
        name: "type_lien"
        widget: "select"
        options:
          - { label: "Vers une page", value: "page" }
          - { label: "Télécharger un PDF", value: "pdf" }
          - { label: "Voir une vidéo", value: "video" }
        default: "page"
      - { label: "Adresse du lien", name: "lien", widget: "string", required: false, hint: "URL de la page, du PDF ou de la vidéo. Laissez # si pas encore de lien." }
      - { label: "Texte du bouton", name: "texte_lien", widget: "string", required: false, default: "Lire l'article" }
      - { label: "Image (facultative)", name: "image", widget: "image", required: false }
